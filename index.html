
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi MTs Riyadhus Sholihin</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #eff8f1;
      color: #23432e;
    }

    .container {
      max-width: 550px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000010;
      text-align: center;
    }

    .header {
      background: #087a43;
      color: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #d9f5e2;
    }

    .kembali {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #hasil {
      background: #edf8f0;
      border-radius: 10px;
      padding: 17px;
      margin: 20px 0;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .mulai {
      background: #128449;
      color: white;
    }

    .berhenti {
      background: #fee2e2;
      color: #b91c1c;
    }

    .selanjutnya {
      background: #2563eb;
      color: white;
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      color: #819087;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>MTs RIYADHUS SHOLIHIN</h2>
    <p>Scanner QR Code Absensi Siswa</p>
  </div>

  <a
    class="kembali"
    href="https://script.google.com/macros/s/AKfycby5415dKDvpm-EcCBXaeb5Et2ADePvwQCTfkuqL1Bx20bqoW6Blwkk7hGOZxHHXN_Yk/exec">
    ← Kembali ke Dashboard Utama
  </a>

  <h3>Silakan Scan QR Siswa</h3>
  <p>Arahkan kamera ke QR Code siswa.</p>

  <div id="reader"></div>

  <div id="hasil">
    Menunggu kamera dibuka...
  </div>

  <button
    type="button"
    class="mulai"
    id="btnMulai"
    onclick="mulaiScan()">
    Buka Kamera
  </button>

  <button
    type="button"
    class="berhenti"
    id="btnBerhenti"
    onclick="berhentiScan()">
    Berhenti
  </button>

  <button
    type="button"
    class="selanjutnya"
    id="btnSelanjutnya"
    onclick="muridSelanjutnya()"
    hidden>
    Murid Selanjutnya →
  </button>

  <div class="footer">
    Sistem Absensi Digital MTs Riyadhus Sholihin
  </div>

</div>

<script>

  // URL WEB APP GOOGLE APPS SCRIPT
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxVtvjX1HJ1iZ-hhYrdxEiAdlcUnTp-mWCLkRnmm2JfVbGAaKRvcVX_uygsYzgTfYHe/exec";

  let scanner = null;
  let scanAktif = false;
  let sedangMemproses = false;
  let menungguMuridBerikutnya = false;

  let timeoutAbsensi = null;
  let scriptAbsensi = null;
  let callbackAktif = null;
  let nomorPermintaan = 0;

  const tombolSelanjutnya =
    document.getElementById("btnSelanjutnya");

  const tombolMulai =
    document.getElementById("btnMulai");

  const tombolBerhenti =
    document.getElementById("btnBerhenti");


  // MENAMPILKAN PESAN
  function tampilkan(pesan) {
    document.getElementById("hasil").textContent = pesan;
  }


  // MEMBERSIHKAN PERMINTAAN ABSENSI
  function bersihkanPermintaan() {

    if (timeoutAbsensi) {
      clearTimeout(timeoutAbsensi);
      timeoutAbsensi = null;
    }

    if (callbackAktif) {
      delete window[callbackAktif];
      callbackAktif = null;
    }

    if (scriptAbsensi) {
      scriptAbsensi.remove();
      scriptAbsensi = null;
    }
  }


  // MENAMPILKAN HASIL DAN MENUNGGU MURID BERIKUTNYA
  function selesaiMemproses(pesan) {

    sedangMemproses = false;
    menungguMuridBerikutnya = true;

    tampilkan(pesan);

    tombolSelanjutnya.hidden = false;
    tombolSelanjutnya.disabled = false;
  }


  // MENGIRIM DATA ABSENSI KE APPS SCRIPT
  function kirimAbsensi(token) {

    const permintaanSekarang = ++nomorPermintaan;

    tampilkan("Memeriksa data siswa...");

    const callbackName =
      "hasilAbsensi_" +
      Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    callbackAktif = callbackName;
    scriptAbsensi = script;

    let selesai = false;

    function akhiriPermintaan() {

      if (selesai) return false;

      selesai = true;
      bersihkanPermintaan();

      return true;
    }


    // BATAS WAKTU PERMINTAAN
    timeoutAbsensi = setTimeout(function() {

      if (permintaanSekarang !== nomorPermintaan) return;

      if (!akhiriPermintaan()) return;

      selesaiMemproses(
        "WAKTU TUNGGU HABIS\n\n" +
        "Tidak ada respons dari server.\n" +
        "Periksa koneksi internet lalu lanjutkan."
      );

    }, 20000);


    // JIKA SERVER MEMBERIKAN RESPONS
    window[callbackName] = function(hasil) {

      if (permintaanSekarang !== nomorPermintaan) return;

      if (!akhiriPermintaan()) return;

      if (!hasil) {

        selesaiMemproses(
          "Respons server tidak valid.\n" +
          "Silakan periksa koneksi."
        );

        return;
      }

      if (hasil.sukses) {

        selesaiMemproses(
          "ABSENSI BERHASIL\n\n" +
          "Nama: " + hasil.nama + "\n" +
          "Kelas: " + hasil.kelas + "\n" +
          "Tanggal: " + hasil.tanggal + "\n" +
          "Jam: " + hasil.jam
        );

      } else {

        selesaiMemproses(
          "ABSENSI DITOLAK\n\n" +
          hasil.pesan
        );

      }

    };


    // JIKA GAGAL MENGHUBUNGI SERVER
    script.onerror = function() {

      if (permintaanSekarang !== nomorPermintaan) return;

      if (!akhiriPermintaan()) return;

      selesaiMemproses(
        "GAGAL MENGHUBUNGI SERVER\n\n" +
        "Periksa URL Apps Script dan koneksi internet."
      );

    };


    // MEMBUAT URL JSONP
    try {

      const url = new URL(SCRIPT_URL);

      url.searchParams.set("action", "scan");
      url.searchParams.set("qrToken", token);
      url.searchParams.set("callback", callbackName);

      script.src = url.toString();

      document.body.appendChild(script);

    } catch (error) {

      if (akhiriPermintaan()) {
        selesaiMemproses(
          "Terjadi kesalahan URL:\n" + error.message
        );
      }

    }

  }


  // KETIKA QR BERHASIL DIBACA
  function qrBerhasil(token) {

    if (
      sedangMemproses ||
      menungguMuridBerikutnya ||
      !scanAktif
    ) {
      return;
    }

    sedangMemproses = true;

    tombolSelanjutnya.hidden = true;

    // JEDA SCANNER SELAMA PROSES ABSENSI
    scanner.pause(true);

    kirimAbsensi(token);

  }


  // MEMULAI KAMERA
  async function mulaiScan() {

    if (scanner || scanAktif) return;

    if (!window.Html5Qrcode) {

      tampilkan(
        "Library scanner gagal dimuat.\n" +
        "Periksa koneksi internet."
      );

      return;
    }

    if (!navigator.mediaDevices) {

      tampilkan(
        "Browser tidak mendukung akses kamera.\n" +
        "Gunakan halaman HTTPS."
      );

      return;
    }

    tombolMulai.disabled = true;

    tampilkan("Menghubungkan kamera...");

    try {

      const kamera = await Html5Qrcode.getCameras();

      if (!kamera || kamera.length === 0) {
        throw new Error("Kamera tidak ditemukan.");
      }

      // PILIH KAMERA BELAKANG JIKA TERSEDIA
      const kameraPilihan =
        kamera.find(k =>
          /back|rear|environment|belakang/i.test(k.label)
        ) || kamera[0];

      scanner = new Html5Qrcode("reader");

      await scanner.start(
        kameraPilihan.id,
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          aspectRatio: 1
        },
        qrBerhasil,
        function() {
          // Abaikan QR yang belum terbaca.
        }
      );

      scanAktif = true;
      sedangMemproses = false;
      menungguMuridBerikutnya = false;

      tampilkan(
        "KAMERA AKTIF\n\n" +
        "Silakan arahkan kamera ke QR Code siswa."
      );

    } catch (error) {

      scanner = null;
      scanAktif = false;

      tampilkan(
        "KAMERA GAGAL DIBUKA\n\n" +
        error.message
      );

    } finally {

      tombolMulai.disabled = false;

    }

  }


  // TOMBOL MURID SELANJUTNYA
  function muridSelanjutnya() {

    if (!scanner || !scanAktif) {

      tampilkan("Silakan buka kamera terlebih dahulu.");

      return;
    }

    if (sedangMemproses) {

      tampilkan("Tunggu proses absensi selesai.");

      return;
    }

    if (!menungguMuridBerikutnya) {

      tampilkan("Scan QR siswa terlebih dahulu.");

      return;
    }

    menungguMuridBerikutnya = false;

    tombolSelanjutnya.hidden = true;

    tampilkan(
      "SIAP MEMINDAI\n\n" +
      "Silakan arahkan kamera ke QR siswa berikutnya."
    );

    try {

      scanner.resume();

    } catch (error) {

      tampilkan(
        "Gagal melanjutkan scanner: " + error.message
      );

    }

  }


  // MENGHENTIKAN KAMERA
  async function berhentiScan() {

    if (!scanner) {

      tampilkan("Kamera belum aktif.");

      return;
    }

    const scannerLama = scanner;

    // Membatalkan respons yang masih tertunda
    nomorPermintaan++;

    bersihkanPermintaan();

    scanAktif = false;
    sedangMemproses = false;
    menungguMuridBerikutnya = false;

    tombolSelanjutnya.hidden = true;

    scanner = null;

    tampilkan("Menghentikan kamera...");

    try {

      await scannerLama.stop();

      scannerLama.clear();

      tampilkan("Pemindaian berhasil dihentikan.");

    } catch (error) {

      tampilkan(
        "Kamera dihentikan atau gagal dihentikan: " +
        error.message
      );

    }

  }

</script>

</body>
</html>
