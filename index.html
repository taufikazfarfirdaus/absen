
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi MTs Riyadhus Sholihin</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #eff8f1;
      color: #23432e;
    }

    .container {
      max-width: 550px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000010;
      text-align: center;
    }

    .header {
      background: #087a43;
      color: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .header h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #d9f5e2;
    }

    .kembali {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      margin: 0 0 15px;
      transition: background 0.2s;
    }

    .kembali:hover {
      background: #1d4ed8;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #hasil {
      background: #edf8f0;
      border-radius: 10px;
      padding: 17px;
      margin: 20px 0;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .mulai {
      background: #128449;
      color: white;
    }

    .berhenti {
      background: #fee2e2;
      color: #b91c1c;
    }

    .footer {
      color: #819087;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>MTs RIYADHUS SHOLIHIN</h2>
    <p>Scanner QR Code Absensi Siswa</p>
  </div>

  <!-- TOMBOL KEMBALI KE DASHBOARD -->
  <a
    class="kembali"
    href="https://script.google.com/macros/s/AKfycbby5415dKDvpm-EcCBXaeb5Et2ADePvwQCTfkuqL1Bx20bqoW6Blwkk7hGOZxHHXN_Yk/exec">
    ← Kembali ke Dashboard Utama
  </a>

  <h3>Silakan Scan QR Siswa</h3>
  <p>Arahkan kamera laptop ke QR Code siswa.</p>

  <div id="reader"></div>

  <div id="hasil">
    Menunggu kamera dibuka...
  </div>

  <button class="mulai" onclick="mulaiScan()">
    Buka Kamera
  </button>

  <button class="berhenti" onclick="berhentiScan()">
    Berhenti
  </button>

  <div class="footer">
    Sistem Absensi Digital MTs Riyadhus Sholihin
  </div>

</div>

<script>
  // URL Web App Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbby5415dKDvpm-EcCBXaeb5Et2ADePvwQCTfkuqL1Bx20bqoW6Blwkk7hGOZxHHXN_Yk/exec";

  let scanner = null;
  let sedangMemproses = false;
  let scanAktif = false;

  function tampilkan(pesan) {
    document.getElementById("hasil").textContent = pesan;
  }

  function kirimAbsensi(token) {
    tampilkan("Memeriksa data siswa...");

    const callbackName =
      "hasilAbsensi_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    let selesai = false;

    const timeout = setTimeout(function() {
      if (selesai) return;
      selesai = true;

      delete window[callbackName];
      script.remove();

      sedangMemproses = false;
      tampilkan("Waktu tunggu habis. Periksa koneksi atau URL Apps Script.");
      lanjutScan();
    }, 20000);

    window[callbackName] = function(hasil) {
      if (selesai) return;
      selesai = true;

      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();

      if (hasil.sukses) {
        tampilkan(
          "ABSENSI BERHASIL\n" +
          "Nama: " + hasil.nama + "\n" +
          "Kelas: " + hasil.kelas + "\n" +
          "Tanggal: " + hasil.tanggal + "\n" +
          "Jam: " + hasil.jam
        );
      } else {
        tampilkan("ABSENSI DITOLAK\n" + hasil.pesan);
      }

      setTimeout(function() {
        sedangMemproses = false;
        lanjutScan();
      }, 2500);
    };

    script.onerror = function() {
      if (selesai) return;
      selesai = true;

      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();

      sedangMemproses = false;
      tampilkan("Gagal menghubungi Apps Script. Periksa URL dan deployment.");
      lanjutScan();
    };

    const url = new URL(SCRIPT_URL);
    url.searchParams.set("action", "scan");
    url.searchParams.set("qrToken", token);
    url.searchParams.set("callback", callbackName);

    script.src = url.toString();
    document.body.appendChild(script);
  }

  function lanjutScan() {
    if (scanner && scanAktif) {
      scanner.resume();
    }
  }

  function mulaiScan() {
    if (scanner) return;

    if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
      tampilkan("URL Apps Script belum diisi dengan benar.");
      return;
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      function(token) {
        if (sedangMemproses) return;

        sedangMemproses = true;
        scanner.pause(true);

        kirimAbsensi(token);
      }
    ).then(function() {
      scanAktif = true;
      tampilkan("Kamera aktif. Silakan scan QR siswa.");
    }).catch(function(error) {
      scanner = null;
      scanAktif = false;
      tampilkan("Kamera gagal dibuka: " + error);
    });
  }

  function berhentiScan() {
    scanAktif = false;

    if (!scanner) {
      tampilkan("Kamera belum aktif.");
      return;
    }

    const scannerLama = scanner;
    scanner = null;
    sedangMemproses = false;

    scannerLama.stop().then(function() {
      scannerLama.clear();
      tampilkan("Pemindaian dihentikan.");
    }).catch(function(error) {
      tampilkan("Gagal menghentikan kamera: " + error);
    });
  }
</script>

</body>
</html>
